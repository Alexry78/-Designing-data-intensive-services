services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-primary
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"     # ⚠️ только для отладки; в prod убрать
    networks:
      - highload-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  app1:
    build: .
    container_name: app1
    hostname: app1
    environment:
      - INSTANCE_NAME=app1
      - DATABASE_URL=postgresql+asyncpg://shop:shop@postgres:5432/shop
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - highload-net

  app2:
    build: .
    container_name: app2
    hostname: app2
    environment:
      - INSTANCE_NAME=app2
      - DATABASE_URL=postgresql+asyncpg://shop:shop@postgres:5432/shop
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - highload-net

  app3:
    build: .
    container_name: app3
    hostname: app3
    environment:
      - INSTANCE_NAME=app3
      - DATABASE_URL=postgresql+asyncpg://shop:shop@postgres:5432/shop
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - highload-net

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - highload-net

networks:
  highload-net:
    driver: bridge

volumes:
  pg_data: